workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android_config
      vars:
        PACKAGE_NAME: "io.codemagic.archcalc"
      node: latest
    triggering:
      events:
        - push
    scripts:
      - name: Build Android APK
        script: |
          cd ArchCalc_Android_Project-2/ArchCalc
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - ArchCalc_Android_Project-2/ArchCalc/app/build/outputs/apk/**/*.apk
      
